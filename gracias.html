<!DOCTYPE html>
<html lang="es-PA">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — JAimpression</title>
<meta name="robots" content="noindex, nofollow">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0a1628; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
.card { max-width: 520px; }
.icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(201,168,76,.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
.icon svg { width: 40px; height: 40px; fill: #c9a84c; }
h1 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
h1 span { color: #c9a84c; }
p { color: #9ca3af; line-height: 1.7; margin-bottom: 32px; font-size: 1.05rem; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: #c9a84c; color: #0a1628; padding: 14px 32px; border-radius: 50px; font-weight: 700; text-decoration: none; transition: all .3s; }
.btn:hover { background: #e0c56a; transform: translateY(-2px); }
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>
  <h1>¡Gracias por <span>escribirnos</span>!</h1>
  <p>Hemos recibido tu mensaje y te responderemos a la brevedad. Por lo general, damos respuesta en menos de 24 horas hábiles.</p>
